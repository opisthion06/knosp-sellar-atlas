<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0a0f14; --panel: #10181f; --panel-2: #16212b; --line: #1f2d3a; --line-2: #2b3d4f;
  --text: #e6edf2; --muted: #93a4b5; --faint: #62768a;
  --accent: #e3a857; --accent-ink: #1d1407;
  --k-med: #5fcbe3; --k-cen: #f0c75e; --k-lat: #ec7ba2;
  --g0: #6cc49a; --g1: #a9cf6a; --g2: #e5c55a; --g3a: #eb9a58; --g3b: #e2685a; --g4: #cf4a72;
  --ok: #6cc49a; --bad: #ec6f6f;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(330px, 400px) 1fr; height: 100%; }
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.brand { padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand h1 { margin: 0; font: 700 21px/1.15 var(--cond); letter-spacing: 0.005em; text-wrap: balance; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.brand-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.lang { display: flex; flex: none; border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 5px 9px; cursor: pointer; font: 600 11.5px/1 var(--mono); letter-spacing: 0.06em; color: var(--muted); }
.lang button + button { border-left: 1px solid var(--line-2); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:hover:not([aria-pressed="true"]) { color: var(--text); }
.stepbody .def span:last-child { flex: 1; }
.lines-key li span { min-width: 0; }

.tabs { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 8px 9px; font: 600 12px/1 var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--text); }
.tabpane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 20px; }

/* lesson */
.steps { display: flex; flex-wrap: wrap; gap: 5px; padding: 14px 20px 4px; }
.steps button { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted); font: 500 11px/1 var(--mono); cursor: pointer; padding: 0; }
.steps button.done { color: var(--text); border-color: #3a5064; }
.steps button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.steps button.gdot:not(.on) { border-color: currentColor; }
.steps button.gdot.g-g0:not(.on) { color: var(--g0); } .steps button.gdot.g-g1:not(.on) { color: var(--g1); }
.steps button.gdot.g-g2:not(.on) { color: var(--g2); } .steps button.gdot.g-g3a:not(.on) { color: var(--g3a); }
.steps button.gdot.g-g3b:not(.on) { color: var(--g3b); } .steps button.gdot.g-g4:not(.on) { color: var(--g4); }
.kicker { font: 600 11px/1 var(--cond); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 6px 0 6px; }
.step-title { margin: 0 0 10px; font: 600 24px/1.15 var(--cond); text-wrap: balance; }
.stepbody { max-width: 62ch; color: #d5dee6; }
.stepbody p { margin: 0 0 11px; }
.stepbody b { color: var(--text); font-weight: 600; }
.stepbody .def { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 14px 0 0; }
.facts div { background: var(--panel-2); padding: 9px 11px; }
.facts dt { font: 600 10.5px/1.3 var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 3px 0 0; font: 500 14px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.lines-key { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 7px; }
.lines-key li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline; }
.lines-key i { height: 3px; border-radius: 2px; align-self: center; }
.k-med { background: var(--k-med); } .k-cen { background: var(--k-cen); } .k-lat { background: var(--k-lat); }
.bul { padding-left: 18px; margin: 14px 0 0; display: flex; flex-direction: column; gap: 8px; }

table.sum th { text-align: left; font: 600 11px/1.25 var(--cond); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 6px 6px 8px; border-bottom: 1px solid var(--line-2); vertical-align: bottom; }
table.sum th small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
table.sum td { padding: 6px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 13px; }
.stepnav { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); }
.stepnav span { flex: 1; text-align: center; font: 500 12px var(--mono); color: var(--muted); }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 5px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: #45607a; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }

.gchip { display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 4px; font: 600 13px/1 var(--mono); color: #10161c; flex: none; }
.g-none { background: #3a4a5a; color: #d6dee6; } .g-g0 { background: var(--g0); } .g-g1 { background: var(--g1); } .g-g2 { background: var(--g2); }
.g-g3a { background: var(--g3a); } .g-g3b { background: var(--g3b); } .g-g4 { background: var(--g4); color: #fff; } .g-q { background: var(--accent); }

/* layers */
.group-h { font: 600 11px/1 var(--cond); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
.toggles { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
.tg { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-radius: 4px; cursor: pointer; }
.tg:hover { background: var(--panel-2); }
.tg input { appearance: none; width: 30px; height: 17px; border-radius: 9px; background: #2a3a4a; position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.tg input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #c8d3dd; transition: transform .15s; }
.tg input:checked { background: var(--accent); }
.tg input:checked::after { transform: translateX(13px); background: #1d1407; }
.tg .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.tg .nm { flex: 1; }
.range { display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 10px; padding: 2px 4px 10px 44px; }
.range output { font: 500 12px var(--mono); color: var(--muted); text-align: right; }
input[type=range] { accent-color: var(--accent); width: 100%; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; margin-bottom: 18px; }
.seg label { flex: 1; text-align: center; padding: 7px 4px; cursor: pointer; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line-2); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--panel-2); color: var(--text); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.help { color: var(--muted); font-size: 12.5px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.help kbd { font: 500 11px var(--mono); color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 5px; white-space: nowrap; }

/* quiz */
.quiz-intro { color: #d5dee6; margin: 0 0 14px; max-width: 60ch; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.answers button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; font: 600 15px var(--mono); }
.answers button:hover:not(:disabled) { border-color: var(--accent); }
.answers button.right { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.answers button.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.answers button:disabled { cursor: default; }
.answers .gchip { min-width: 12px; width: 12px; height: 12px; padding: 0; border-radius: 3px; }
#quizFeedback p { margin: 0 0 8px; }
#quizFeedback .ok b { color: var(--ok); } #quizFeedback .bad b { color: var(--bad); }
.muted { color: var(--muted); }

/* references */
.refs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.refs li { font-size: 13px; color: #cdd7e0; }
.refs a { color: var(--k-med); text-decoration: none; border-bottom: 1px solid rgba(95,203,227,.35); }
.refs a:hover { border-bottom-color: var(--k-med); }
.note { margin-top: 18px; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 6px; font-size: 12.5px; color: var(--muted); }

/* stage */
.stage { position: relative; overflow: hidden; min-height: 0; background: radial-gradient(110% 85% at 58% 38%, #1a2530 0%, #0e141b 52%, #07090c 100%); }
canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { width: 0; height: 0; transition: opacity .25s; }
.lbl .dot { position: absolute; left: -3.5px; top: -3.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px rgba(8,12,16,.75); }
.lbl .txt { position: absolute; left: 11px; top: -11px; white-space: nowrap; font: 500 11.5px/1 var(--cond); letter-spacing: 0.02em; color: #f4efe4; background: rgba(9,14,19,.74); border: 1px solid rgba(255,255,255,.09); padding: 5px 7px; border-radius: 3px; }
.lbl.left .txt { left: auto; right: 11px; }
.lbl.occ { opacity: 0.3; }
.zone { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--mono); color: #fff; background: rgba(6,9,12,.7); border: 1px solid rgba(255,255,255,.3); }
.axis { font: 600 10px/1 var(--cond); letter-spacing: 0.22em; color: rgba(190,208,226,.36); white-space: nowrap; }

.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.glass { background: rgba(11,17,23,.8); border: 1px solid var(--line-2); border-radius: 7px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hud-tl { top: 16px; left: 16px; display: flex; flex-direction: column; gap: 10px; width: min(330px, calc(100% - 32px)); }
.badge { display: flex; align-items: center; gap: 11px; padding: 7px 13px 7px 7px; align-self: flex-start; }
.bg-num { display: grid; place-items: center; min-width: 38px; height: 38px; padding: 0 6px; border-radius: 5px; font: 600 17px/1 var(--mono); color: #10161c; }
.badge .bt { display: flex; flex-direction: column; }
.badge .bt small { font: 600 10px/1.2 var(--cond); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.badge .bt span { font-weight: 500; font-size: 13px; }
.info { padding: 12px 14px; }
.info h3 { margin: 0; font: 600 16px/1.25 var(--cond); }
.info .lat { margin: 2px 0 6px; font-style: italic; color: var(--muted); font-size: 12.5px; }
.info p { margin: 0 0 10px; font-size: 13px; color: #d3dde6; }
.info .row { display: flex; gap: 8px; }
.info .row .btn { padding: 5px 10px; font-size: 12.5px; }

.hud-tr { top: 16px; right: 16px; display: flex; gap: 8px; align-items: flex-start; }
.views { display: flex; padding: 3px; gap: 2px; }
.views button { background: none; border: 0; padding: 6px 9px; border-radius: 4px; cursor: pointer; font: 500 12px/1 var(--cond); letter-spacing: 0.04em; color: #c9d4de; }
.views button:hover { background: var(--panel-2); color: #fff; }
.iconbtn { padding: 8px 10px; font: 500 12px/1 var(--cond); cursor: pointer; color: #c9d4de; }
.iconbtn[aria-pressed="true"] { color: var(--accent); }

.hud-bottom { left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.gradebar { display: flex; align-items: center; gap: 4px; padding: 5px; max-width: 100%; overflow-x: auto; }
.gradebar .gl-l { font: 600 10.5px/1.15 var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 0 6px 0 4px; white-space: nowrap; }
.gradebar button { border: 1px solid transparent; background: none; border-radius: 4px; padding: 6px 9px; min-width: 36px; cursor: pointer; font: 600 13px/1 var(--mono); color: #cdd7e0; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.gradebar button i { width: 8px; height: 8px; border-radius: 2px; }
.gradebar button:hover { background: var(--panel-2); }
.gradebar button.on { background: #22303d; border-color: var(--line-2); color: #fff; }
.gradebar button[data-g="none"] { font-family: var(--cond); font-weight: 500; font-size: 12px; }
.app.quiz .gradebar button.on { background: none; border-color: transparent; color: #cdd7e0; }
.app.quiz .gradebar { opacity: .45; }
.cutbar { display: flex; align-items: center; gap: 10px; padding: 7px 12px; }
.cutbar label.chk { display: flex; align-items: center; gap: 7px; font: 500 12.5px var(--cond); cursor: pointer; white-space: nowrap; }
.cutbar input[type=checkbox] { accent-color: var(--accent); }
.cutbar input[type=range] { width: 150px; }
.cutbar output { font: 500 12px var(--mono); color: var(--muted); min-width: 64px; }
.knote { font-size: 11.5px; color: var(--g3a); }

.inset { position: absolute; right: 16px; bottom: 76px; width: 300px; padding: 8px; }
.inset { z-index: 3; overflow: hidden; resize: horizontal; min-width: 180px; max-width: min(640px, 70vw); }
.inset header { display: flex; align-items: center; gap: 6px; padding: 0 2px 6px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 4px; }
.inset.dragging { box-shadow: 0 10px 34px rgba(0,0,0,.55); border-color: #45607a; }
.inset.dragging header { cursor: grabbing; }
.inset header .grip { color: var(--faint); font-size: 13px; line-height: 1; }
.inset header b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 11px/1 var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.inset .ibtns { display: flex; gap: 2px; flex: none; }
.inset header button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 3px; }
.inset header button:hover { color: var(--text); background: var(--panel-2); }
.inset.min { resize: none; }
.inset.min canvas, .inset.min .legend { display: none; }
.inset.min header { padding-bottom: 0; }
.inset canvas { width: 100%; height: auto; display: block; border-radius: 4px; background: #000; }
.inset .legend { display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 2px 0; font-size: 11px; color: var(--muted); }
.inset .legend span { display: inline-flex; align-items: center; gap: 5px; }
.inset .legend i { width: 14px; height: 3px; border-radius: 2px; }

.tip { position: absolute; top: 0; left: 0; pointer-events: none; padding: 6px 9px; font-size: 12.5px; max-width: 260px; }
.tip b { font-weight: 600; display: block; }
.tip span { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }

.loader { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(90% 80% at 50% 45%, #121b24, #07090c); transition: opacity .6s; z-index: 5; }
.loader.done { opacity: 0; pointer-events: none; }
.loader .box { width: min(340px, calc(100% - 48px)); display: flex; flex-direction: column; gap: 10px; }
.loader h2 { margin: 0; font: 600 18px/1.2 var(--cond); }
.loader .bar { height: 3px; background: #1d2934; border-radius: 2px; overflow: hidden; }
.loader .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: 66vh auto; height: auto; min-height: 100%; }
  .views { display: none; }
  .zone { width: 18px; height: 18px; font-size: 10.5px; }
  .lbl .txt { font-size: 10.5px; padding: 4px 6px; }
  .gradebar { width: 100%; }
  .gradebar button { padding: 6px 7px; min-width: 30px; }
  .panel { border-right: 0; border-top: 1px solid var(--line); order: 2; }

  .scroll { overflow: visible; }
  .brand { padding: 14px 16px 10px; }
  .steps, .scroll { padding-left: 16px; padding-right: 16px; }
  .stepnav { position: sticky; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .hud-tl { top: 12px; left: 12px; width: calc(100% - 24px); }
  .hud-tr { top: auto; bottom: 116px; right: 12px; }
  .views button { padding: 6px 7px; font-size: 11px; }
  .hud-bottom { left: 12px; right: 12px; bottom: 12px; }
  .cutbar input[type=range] { width: 100%; flex: 1; min-width: 80px; }
  .cutbar { flex: 1; }
  .inset { width: 150px; right: 12px; bottom: auto; top: 12px; padding: 5px; }
  .inset .legend, .inset header b { display: none; }
  .info { max-width: calc(100% - 170px); }
  .badge .bt small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
